<x-dc>
<helmet>

<style>

a{color:#0B2545}a:hover{color:#3E6E8A}

</style>
</helmet>
<div style="position:relative;width:393px;height:852px;box-sizing:border-box;padding:59px 20px 0;background:#FFFFFF;font-family:Inter,system-ui,sans-serif;color:#0E1826;overflow:hidden">

  <h1 style="margin:0;height:52px;display:flex;align-items:center;font-size:30px;font-weight:700;letter-spacing:-0.035em">Профиль</h1>
  <div style="display:flex;align-items:center;gap:14px;margin-top:14px">
    <span style="width:56px;height:56px;border-radius:50%;background:#0B2545;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600">АС</span>
    <span style="flex:1"><span style="display:block;font-size:18px;font-weight:700;letter-spacing:-0.02em">Айгерим Сапарова</span><span style="font-size:14px;color:#6B7685">ТОО «Береке» · Алматы</span></span>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;margin-top:20px">

    <div style="padding:14px;border-radius:18px;border:1px solid #EEF0F3"><span style="display:block;font-size:12px;color:#6B7685">Отправлений в октябре</span><span style="display:block;margin-top:6px;font-size:20px;font-weight:700;letter-spacing:-0.02em">14</span></div>
  </div>

  <div style="margin-top:12px;border-radius:18px;background:#F4F6F8;overflow:hidden">
    <a href="#" style="display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;text-decoration:none;color:#0E1826;font-size:15px;font-weight:500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="10" r="3"></circle><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path></svg><span style="flex:1">Личные данные</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A94A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
    <a href="#" style="display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;text-decoration:none;color:#0E1826;font-size:15px;font-weight:500;border-top:1px solid rgba(14,24,38,.06)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path></svg><span style="flex:1">Адресная книга</span><span style="font-size:14px;color:#6B7685">23</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A94A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
    <a href="#" style="display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;text-decoration:none;color:#0E1826;font-size:15px;font-weight:500;border-top:1px solid rgba(14,24,38,.06)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg><span style="flex:1">Договор и акты</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A94A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
  </div>

  <div style="margin-top:12px;border-radius:18px;background:#F4F6F8;overflow:hidden">
    <div style="display:flex;align-items:center;gap:12px;height:54px;padding:0 12px 0 16px;font-size:15px;font-weight:500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg><span style="flex:1">Тёмная тема</span>
      <button type="button" role="switch" aria-label="Тёмная тема" aria-checked="{{darkChecked}}" onClick="{{toggleDark}}" style="position:relative;width:51px;height:31px;border-radius:999px;border:0;cursor:pointer;transition:background .2s;background:{{darkTrack}}"><span style="position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 6px rgba(14,24,38,.18);transition:transform .2s cubic-bezier(.2,.8,.2,1);transform:translateX({{darkKnob}}px)"></span></button>
    </div>
    <a href="#" style="display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;text-decoration:none;color:#0E1826;font-size:15px;font-weight:500;border-top:1px solid rgba(14,24,38,.06)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg><span style="flex:1">Язык</span><span style="font-size:14px;color:#6B7685">Русский</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A94A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
    <button type="button" onClick="{{askLogout}}" style="width:100%;display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;border:0;border-top:1px solid rgba(14,24,38,.06);background:transparent;font:500 15px Inter,sans-serif;color:#B3302F;text-align:left;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>Выйти</button>
  </div>

  <nav aria-label="Основная навигация" style="position:absolute;left:28px;right:28px;bottom:28px;z-index:10;height:64px;padding:0 8px;box-sizing:border-box;border-radius:32px;background:rgba(255,255,255,.72);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(14,24,38,.06);box-shadow:0 12px 32px rgba(14,24,38,.14);display:flex;align-items:center;justify-content:space-between">
    <a href="iOS-Home.dc.html" aria-label="Расчёт" style="width:48px;height:48px;border-radius:50%;color:#4A5565;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="20" x="4" y="2" rx="2"></rect><path d="M8 6h8M16 14v4M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01"></path></svg></a>
    <a href="iOS-Orders.dc.html" aria-label="Заказы" style="width:48px;height:48px;border-radius:50%;color:#4A5565;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"></path><path d="M12 22V12"></path><path d="m3.3 7 7.7 4.7a2 2 0 0 0 2 0L20.7 7"></path></svg></a>
    <a href="iOS-Tracking.dc.html" aria-label="Отследить" style="width:48px;height:48px;border-radius:50%;color:#4A5565;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="8"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg></a>
    <a href="iOS-Notifications.dc.html" aria-label="Уведомления" style="position:relative;width:48px;height:48px;border-radius:50%;color:#4A5565;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg><span style="position:absolute;top:12px;right:13px;width:7px;height:7px;border-radius:50%;background:#22C9E0"></span></a>
    <a href="iOS-Profile.dc.html" aria-label="Профиль" aria-current="page" style="width:48px;height:48px;border-radius:50%;background:#0B2545;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></a>
  </nav>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;z-index:20">
      <button type="button" aria-label="Закрыть" onClick="{{cancel}}" style="position:absolute;inset:0;border:0;background:rgba(14,24,38,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:nxDim .2s both;cursor:pointer"></button>
      <div role="dialog" aria-label="Выход из аккаунта" style="position:absolute;left:10px;right:10px;bottom:28px;background:rgba(255,255,255,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:28px;padding:26px 18px 18px;text-align:center;box-shadow:0 20px 50px rgba(14,24,38,.25);animation:nxSheet .3s cubic-bezier(.2,.8,.2,1) both">
        <div style="font-size:18px;font-weight:700;letter-spacing:-0.02em">Выйти из аккаунта?</div>
        <p style="margin:8px 0 0;font-size:14px;line-height:1.5;color:#6B7685">Черновики заказов сохранятся. Вернуться можно тем же email <span style="color:#0E1826;font-weight:600">aigerim@bereke.kz</span></p>
        <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px;margin-top:20px">
          <a href="iOS-SignIn.dc.html" style="height:52px;border-radius:999px;background:#F4F6F8;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#B3302F;text-decoration:none">Выйти</a>
          <button type="button" onClick="{{cancel}}" style="height:52px;border:0;border-radius:999px;background:#22C9E0;font:600 15px Inter,sans-serif;color:#0E1826;cursor:pointer">Остаться</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dark: false, sheet: false };
  }
  renderVals() {
    var s = this.state, self = this;
    return {
      darkChecked: s.dark ? 'true' : 'false',
      darkTrack: s.dark ? '#0B2545' : '#DDE1E6',
      darkKnob: s.dark ? 20 : 0,
      toggleDark: function () { self.setState({ dark: !s.dark }); },
      sheet: s.sheet,
      askLogout: function () { self.setState({ sheet: true }); },
      cancel: function () { self.setState({ sheet: false }); }
    };
  }
}
</script>
</body>
</html>
