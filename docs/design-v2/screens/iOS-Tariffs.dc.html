<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тарифы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#0B2545}a:hover{color:#3E6E8A}
.nx-scroll{scrollbar-width:none}.nx-scroll::-webkit-scrollbar{display:none}
@keyframes nxPrice{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position:relative;width:393px;height:852px;background:#FFFFFF;font-family:Inter,system-ui,sans-serif;color:#0E1826;overflow:hidden">

  <div style="position:absolute;left:0;right:0;top:0;height:103px;padding:59px 8px 0;box-sizing:border-box;display:flex;align-items:center;background:rgba(255,255,255,.78);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);z-index:2">
    <a href="iOS-Home.dc.html" aria-label="Назад" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#0E1826"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
    <span style="flex:1;text-align:center;font-size:18px;font-weight:500">Тарифы</span>
    <button type="button" aria-label="Фильтры" style="width:44px;height:44px;border:0;background:transparent;color:#0E1826;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"></path><path d="M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg></button>
  </div>

  <div class="nx-scroll" style="position:absolute;left:0;right:0;top:0;bottom:0;overflow-y:auto;padding:115px 20px 130px;box-sizing:border-box">
    <div style="display:flex;align-items:center;gap:10px"><span style="font-size:28px;font-weight:800;letter-spacing:-0.03em">ALA</span><span style="flex:1;height:1.5px;background:repeating-linear-gradient(90deg,#0E1826 0 3px,transparent 3px 7px)"></span><span style="font-size:28px;font-weight:800;letter-spacing:-0.03em">NQZ</span></div>
    <div style="font-size:14px;color:#6B7685;margin-top:4px">Посылка M · 3,5 кг · нашли 5 тарифов</div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <sc-for list="{{sorts}}" as="o" hint-placeholder-count="2">
        <button type="button" onClick="{{o.pick}}" style="height:40px;padding:0 16px;border-radius:999px;font:600 14px Inter,sans-serif;cursor:pointer;transition:all .2s;background:{{o.bg}};color:{{o.fg}};border:{{o.border}}">{{o.label}}</button>
      </sc-for>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">
      <sc-for list="{{items}}" as="t" hint-placeholder-count="5">
        <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="position:relative;display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:#FFFFFF;font-family:inherit;text-align:left;cursor:pointer;transition:border-color .2s;border:{{t.border}}">
          <span style="width:60px;height:60px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;background:{{t.logoBg}};border:{{t.logoBorder}}"><img src="{{t.logo}}" alt="{{t.carrier}}" style="width:{{t.logoW}};height:auto;display:block"></span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <span style="font-size:17px;font-weight:600;color:#0E1826">{{t.name}}</span>
            <span style="font-size:17px;font-weight:700;color:#0B2545">{{t.price}}</span>
            <span style="font-size:13px;color:#6B7685">{{t.eta}} · {{t.mode}}</span>
          </span>
          <sc-if value="{{t.badge}}" hint-placeholder-val="{{ false }}">
            <span style="position:absolute;right:14px;bottom:14px;font-size:12px;font-weight:600;color:#0B2545">{{t.badge}}</span>
          </sc-if>
          <sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}">
            <span style="position:absolute;right:14px;top:14px;width:22px;height:22px;border-radius:50%;background:#22C9E0;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E1826" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:104px;background:rgba(255,255,255,.78);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:1px solid rgba(14,24,38,.06)">
    <div style="height:2px;background:#EEF0F3"><div style="width:25%;height:100%;background:#0B2545"></div></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 0">
      <div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:13px;color:#6B7685">Итого</span><span key="{{selPrice}}" style="font-size:22px;font-weight:700;color:#0B2545;animation:nxPrice .2s cubic-bezier(.2,.8,.2,1) both">{{selPrice}}</span></div>
      <a href="iOS-Checkout.dc.html" style="height:52px;padding:0 28px;border-radius:999px;background:#22C9E0;color:#0E1826;display:flex;align-items:center;font-size:16px;font-weight:600;text-decoration:none">Оформить</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'cse-x', sort: 'price' };
  }
  renderVals() {
    var s = this.state, self = this;
    var L = {
      CSE: { src: '/_blob/16cf765e94562a599e760790be7ce3e1', bg: '#FFFFFF', border: '1px solid #EEF0F3', w: '44px' },
      EXL: { src: '/_blob/0cdd48371ba1f7e4839fa252b5289716', bg: '#FFFFFF', border: '1px solid #EEF0F3', w: '52px' },
      AZM: { src: '/_blob/1fabec4d0df39fb70222db9c94e71ee5', bg: '#0B2545', border: '0', w: '48px' }
    };
    var data = [
      { id: 'cse-x', c: 'CSE', carrier: 'CSE', name: 'CSE Экспресс', min: 2, max: 3, price: 4890, mode: 'курьер заберёт' },
      { id: 'exl-s', c: 'EXL', carrier: 'Exline', name: 'Exline Стандарт', min: 3, max: 5, price: 4350, mode: 'курьер заберёт' },
      { id: 'azm-x', c: 'AZM', carrier: 'Azimuth', name: 'Azimuth Экспресс', min: 1, max: 2, price: 6100, mode: 'курьер заберёт' },
      { id: 'cse-e', c: 'CSE', carrier: 'CSE', name: 'CSE Эконом', min: 4, max: 6, price: 4520, mode: 'сдать в пункт' },
      { id: 'exl-x', c: 'EXL', carrier: 'Exline', name: 'Exline Экспресс', min: 2, max: 3, price: 5200, mode: 'курьер заберёт' }
    ];
    var fmt = function (n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₸'; };
    var sorted = data.slice().sort(function (a, b) { return s.sort === 'price' ? a.price - b.price : (a.min - b.min) || (a.price - b.price); });
    var items = sorted.map(function (d) {
      var on = s.sel === d.id, l = L[d.c];
      return {
        name: d.name, carrier: d.carrier, price: fmt(d.price), mode: d.mode, eta: d.min + '–' + d.max + ' дн.', on: on,
        logo: l.src, logoBg: l.bg, logoBorder: l.border, logoW: l.w,
        badge: on ? '' : (d.id === 'exl-s' ? 'Дешевле всех' : (d.id === 'azm-x' ? 'Быстрее всех' : '')),
        border: on ? '1.5px solid #22C9E0' : '1px solid #EEF0F3',
        pick: function () { self.setState({ sel: d.id }); }
      };
    });
    var sorts = [{ id: 'price', label: 'Сначала дешевле' }, { id: 'eta', label: 'Сначала быстрее' }].map(function (o) {
      var on = s.sort === o.id;
      return { label: o.label, bg: on ? '#0B2545' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0E1826', border: on ? '1px solid #0B2545' : '1px solid #EEF0F3', pick: function () { self.setState({ sort: o.id }); } };
    });
    var cur = data.filter(function (d) { return d.id === s.sel; })[0];
    return { items: items, sorts: sorts, selPrice: fmt(cur.price) };
  }
}
</script>
</body>
</html>
