<div style="position:relative;width:393px;height:852px;box-sizing:border-box;padding:59px 20px 0;background:#FFFFFF;font-family:Inter,system-ui,sans-serif;color:#0E1826;overflow:hidden">

  <div style="display:flex;align-items:center;justify-content:space-between;height:52px">

    <button type="button" style="height:36px;padding:0 14px;border:0;border-radius:999px;background:#F4F6F8;font:600 13px Inter,sans-serif;color:#0E1826">Прочитать все</button>
  </div>

  <sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
    <div style="margin-top:22px;font-size:13px;font-weight:600;color:#6B7685">{{sec.title}}</div>
    <div style="margin-top:4px">
      <sc-for list="{{sec.items}}" as="n" hint-placeholder-count="2">
        <a href="{{n.href}}" style="display:flex;align-items:center;gap:14px;padding:12px 0;text-decoration:none;color:inherit">
          <span style="width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:{{n.tint}}">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0E1826" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
          </span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <span style="font-size:15px;font-weight:600;letter-spacing:-0.01em">{{n.title}}</span>
            <span style="font-size:13px;color:#6B7685;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{n.text}}</span>
          </span>
          <span style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none">
            <span style="font-size:12px;color:#6B7685">{{n.time}}</span>
            <span style="width:8px;height:8px;border-radius:50%;background:{{n.dot}}"></span>
          </span>
        </a>
      </sc-for>
    </div>
  </sc-for>

    <a href="iOS-Tracking.dc.html" aria-label="Отследить" style="width:48px;height:48px;border-radius:50%;color:#4A5565;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="8"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg></a>

    <a href="iOS-Profile.dc.html" aria-label="Профиль" style="width:48px;height:48px;border-radius:50%;color:#4A5565;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></a>
