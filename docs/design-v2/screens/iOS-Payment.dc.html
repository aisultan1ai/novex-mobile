<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Оплата</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#0B2545}a:hover{color:#3E6E8A}
@keyframes nxStep{from{width:50%}to{width:75%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position:relative;width:393px;height:852px;box-sizing:border-box;padding:59px 20px 0;background:#FFFFFF;font-family:Inter,system-ui,sans-serif;color:#0E1826;overflow:hidden">

  <div style="display:flex;align-items:center;height:44px;margin:0 -12px">
    <a href="iOS-Checkout.dc.html" aria-label="Назад" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#0E1826"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
    <span style="flex:1;text-align:center;font-size:18px;font-weight:500;margin-right:44px">Способ оплаты</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px;margin-top:24px">
    <sc-for list="{{methods}}" as="m" hint-placeholder-count="2">
      <button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="display:flex;align-items:center;gap:14px;height:72px;padding:0 18px;border-radius:20px;background:#FFFFFF;font-family:inherit;text-align:left;cursor:pointer;transition:border-color .2s;border:{{m.border}}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0E1826" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg>
        <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:600;color:#0E1826">{{m.label}}</span><span style="font-size:13px;color:#6B7685">{{m.hint}}</span></span>
        <span style="width:22px;height:22px;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;transition:all .2s;background:{{m.dotBg}};border:{{m.dotBorder}}"><sc-if value="{{m.on}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E1826" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{isTransfer}}" hint-placeholder-val="{{ true }}">
    <div>
      <div style="margin-top:28px;font-size:18px;font-weight:600">Реквизиты</div>
      <div style="margin-top:4px">
        <div style="display:flex;align-items:center;min-height:60px;border-bottom:1px solid #EEF0F3"><span style="flex:1"><span style="display:block;font-size:13px;color:#6B7685">Получатель</span><span style="font-size:16px;font-weight:500">[НАЗВАНИЕ ЮРЛИЦА]</span></span></div>
        <div style="display:flex;align-items:center;min-height:60px;border-bottom:1px solid #EEF0F3"><span style="flex:1"><span style="display:block;font-size:13px;color:#6B7685">IBAN</span><span style="font-size:16px;font-weight:500">[IBAN]</span></span><button type="button" aria-label="Скопировать IBAN" style="width:44px;height:44px;border:0;background:transparent;color:#0E1826;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg></button></div>
        <div style="display:flex;align-items:center;min-height:60px;border-bottom:1px solid #EEF0F3"><span style="flex:1"><span style="display:block;font-size:13px;color:#6B7685">Назначение платежа</span><span style="font-size:16px;font-weight:700;color:#0B2545">NOVEX-000123</span></span><button type="button" aria-label="Скопировать назначение платежа" style="width:44px;height:44px;border:0;background:transparent;color:#0E1826;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg></button></div>
      </div>
      <button type="button" style="margin-top:20px;width:100%;height:56px;border-radius:999px;border:1px dashed #C9D0D8;background:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px Inter,sans-serif;color:#0E1826;cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h8"></path><path d="M12 8v8"></path></svg>
        Прикрепить чек · фото или PDF
      </button>
    </div>
  </sc-if>
  <sc-if value="{{isContract}}" hint-placeholder-val="{{ false }}">
    <p style="margin:24px 0 0;font-size:15px;line-height:1.5;color:#6B7685">Платить сейчас не нужно. Сумма войдёт в акт за ноябрь по договору № [НОМЕР].</p>
  </sc-if>

  <div style="position:absolute;left:0;right:0;bottom:0;height:104px;background:rgba(255,255,255,.78);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:1px solid rgba(14,24,38,.06)">
    <div style="height:2px;background:#EEF0F3"><div style="width:75%;height:100%;background:#0B2545;animation:nxStep .5s cubic-bezier(.2,.8,.2,1) both"></div></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 0">
      <span style="display:flex;align-items:baseline;gap:6px"><span style="font-size:13px;color:#6B7685">Итого</span><span style="font-size:22px;font-weight:700;color:#0B2545">5 380 ₸</span></span>
      <a href="iOS-Success.dc.html" style="height:52px;padding:0 24px;border-radius:999px;background:#22C9E0;color:#0E1826;display:flex;align-items:center;font-size:16px;font-weight:600;text-decoration:none">{{cta}}</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { m: 'transfer' };
  }
  renderVals() {
    var self = this, cur = this.state.m;
    var methods = [
      { id: 'transfer', label: 'Перевод по реквизитам', hint: 'Проверим чек за 15 минут', icon: 'M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3' },
      { id: 'contract', label: 'По договору', hint: 'Без оплаты сейчас · в акте', icon: 'M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7ZM14 2v4a2 2 0 0 0 2 2h4M9 15l2 2 4-4' }
    ].map(function (m) {
      var on = cur === m.id;
      return {
        label: m.label, hint: m.hint, icon: m.icon, on: on,
        border: on ? '1.5px solid #22C9E0' : '1px solid #EEF0F3',
        dotBg: on ? '#22C9E0' : '#FFFFFF', dotBorder: on ? '0' : '1.5px solid #C9D0D8',
        pick: function () { self.setState({ m: m.id }); }
      };
    });
    return { methods: methods, isTransfer: cur === 'transfer', isContract: cur === 'contract', cta: cur === 'transfer' ? 'Я оплатил' : 'Оформить' };
  }
}
</script>
</body>
</html>
