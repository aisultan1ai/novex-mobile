<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Онбординг</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B2545}
a{color:#FFFFFF}a:hover{color:#22C9E0}
@keyframes nxIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes nxFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes nxMove{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes nxRoad{to{stroke-dashoffset:-60}}
@keyframes nxWheel{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position:relative;width:393px;height:852px;background:#0B2545;font-family:Inter,system-ui,sans-serif;color:#FFFFFF;overflow:hidden">

  <a href="iOS-SignIn.dc.html" style="position:absolute;right:16px;top:59px;height:40px;display:flex;align-items:center;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:14px;font-weight:600;color:#FFFFFF;text-decoration:none;z-index:2">Пропустить</a>

  <!-- Сцена -->
  <div style="position:absolute;left:0;top:90px;width:393px;height:360px">
    <sc-if value="{{s0}}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;inset:0">
        <svg width="393" height="360" viewBox="0 0 393 360" fill="none" aria-hidden="true" style="position:absolute;inset:0">
          <path d="M40 300 C 140 300, 130 150, 220 140 S 320 100, 350 70" stroke="rgba(255,255,255,.28)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"></path>
          <circle cx="40" cy="300" r="7" fill="#0B2545" stroke="#FFFFFF" stroke-width="2"></circle>
          <path d="M350 52 c-9 0 -16 7 -16 15 c0 11 16 25 16 25 s16 -14 16 -25 c0 -8 -7 -15 -16 -15 z" fill="#22C9E0" stroke="#FFFFFF" stroke-width="2"></path>
          <circle cx="350" cy="67" r="5" fill="#0B2545"></circle>
        </svg>
        <div style="position:absolute;left:0;top:0;width:72px;height:72px;offset-path:path('M40 300 C 140 300, 130 150, 220 140 S 320 100, 350 70');offset-rotate:0deg;offset-anchor:50% 80%;animation:nxMove 3.6s cubic-bezier(.45,0,.2,1) infinite">
          <svg width="72" height="72" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M24 6 L42 15 L24 24 L6 15 Z" fill="#22C9E0" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"></path>
            <path d="M6 15 L6 33 L24 42 L24 24 Z" fill="#0B2545" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"></path>
            <path d="M42 15 L42 33 L24 42 L24 24 Z" fill="#0B2545" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"></path>
            <path d="M15 10.5 L33 19.5 L33 25" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{s1}}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0">
        <svg width="393" height="360" viewBox="0 0 393 360" fill="none" aria-hidden="true" style="position:absolute;inset:0">
          <path d="M24 250 V 186 H 64 V 250 M 72 250 V 150 H 116 V 250 M 124 250 V 200 H 160 V 250 M 236 250 V 170 H 276 V 250 M 284 250 V 196 H 336 V 250" stroke="rgba(255,255,255,.22)" stroke-width="1.5" stroke-linejoin="round"></path>
          <line x1="0" y1="250" x2="393" y2="250" stroke="rgba(255,255,255,.6)" stroke-width="1.5"></line>
          <line x1="0" y1="300" x2="393" y2="300" stroke="rgba(255,255,255,.3)" stroke-width="2" stroke-dasharray="26 34" style="animation:nxRoad .8s linear infinite"></line>
          <line x1="0" y1="344" x2="393" y2="344" stroke="rgba(255,255,255,.6)" stroke-width="1.5"></line>
        </svg>
        <div style="position:absolute;left:106px;top:162px;width:190px;height:110px">
          <svg width="190" height="110" viewBox="0 0 190 110" fill="none" aria-hidden="true">
            <rect x="4" y="10" width="110" height="66" rx="8" fill="#0B2545" stroke="#FFFFFF" stroke-width="2"></rect>
            <path d="M118 30 H 152 L 178 58 V 76 H 118 Z" fill="#22C9E0" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"></path>
            <path d="M126 37 H 148 L 164 54 H 126 Z" fill="#0B2545" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"></path>
            <path d="M22 30 h40 M22 44 h24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path>
            <circle cx="92" cy="36" r="6" fill="#22C9E0"></circle>
          </svg>
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true" style="position:absolute;left:20px;top:62px;animation:nxWheel .7s linear infinite"><circle cx="17" cy="17" r="14" fill="#0B2545" stroke="#FFFFFF" stroke-width="2"></circle><path d="M17 8v18M8 17h18" stroke="#FFFFFF" stroke-width="1.5"></path></svg>
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true" style="position:absolute;left:136px;top:62px;animation:nxWheel .7s linear infinite"><circle cx="17" cy="17" r="14" fill="#0B2545" stroke="#FFFFFF" stroke-width="2"></circle><path d="M17 8v18M8 17h18" stroke="#FFFFFF" stroke-width="1.5"></path></svg>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0">
        <svg width="393" height="360" viewBox="0 0 393 360" fill="none" aria-hidden="true" style="position:absolute;inset:0">
          <path d="M250 104 a14 14 0 0 1 26 -6 a12 12 0 0 1 22 8 a10 10 0 0 1 -2 20 h-44 a11 11 0 0 1 -2 -22 z" stroke="rgba(255,255,255,.4)" stroke-width="1.5"></path>
          <path d="M50 190 a12 12 0 0 1 22 -5 a10 10 0 0 1 18 7 a9 9 0 0 1 -2 17 h-36 a9 9 0 0 1 -2 -19 z" stroke="rgba(255,255,255,.4)" stroke-width="1.5"></path>
          <path d="M30 320 C 130 320, 170 150, 350 70" stroke="rgba(255,255,255,.28)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"></path>
          <circle cx="30" cy="320" r="7" fill="#0B2545" stroke="#FFFFFF" stroke-width="2"></circle>
          <path d="M350 52 c-9 0 -16 7 -16 15 c0 11 16 25 16 25 s16 -14 16 -25 c0 -8 -7 -15 -16 -15 z" fill="#22C9E0" stroke="#FFFFFF" stroke-width="2"></path>
          <circle cx="350" cy="67" r="5" fill="#0B2545"></circle>
        </svg>
        <div style="position:absolute;left:0;top:0;width:84px;height:46px;offset-path:path('M30 320 C 130 320, 170 150, 350 70');offset-rotate:auto;animation:nxMove 3.6s cubic-bezier(.45,0,.2,1) infinite">
          <svg width="84" height="46" viewBox="0 0 80 44" fill="none" aria-hidden="true">
            <path d="M6 24 C 6 20, 12 18, 22 18 L 62 18 C 72 18, 78 21, 78 24 C 78 27, 72 29, 62 29 L 22 29 C 12 29, 6 27, 6 24 Z" fill="#0B2545" stroke="#FFFFFF" stroke-width="1.6"></path>
            <path d="M36 24 L 46 40 L 53 40 L 50 24" fill="#22C9E0" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"></path>
            <path d="M12 19 L 6 8 L 13 8 L 22 18" fill="#22C9E0" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"></path>
            <path d="M28 23h2M34 23h2M40 23h2M58 23h2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </div>
      </div>
    </sc-if>
  </div>

  <!-- Текст -->
  <div style="position:absolute;left:28px;right:28px;top:470px">
    <div key="{{slide}}" style="animation:nxIn .35s cubic-bezier(.2,.8,.2,1) both">
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.02em">novex<span style="color:#22C9E0">.</span></div>
      <h1 style="margin:14px 0 0;font-size:40px;font-weight:700;line-height:1.05;letter-spacing:-0.045em;white-space:pre-line">{{title}}</h1>
      <p style="margin:14px 0 0;font-size:17px;line-height:1.45;color:rgba(255,255,255,.82)">{{text}}</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px;margin-top:28px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="3">
        <button type="button" aria-label="{{b.label}}" onClick="{{b.go}}" style="height:12px;padding:4px 0;border:0;background:transparent;cursor:pointer">
          <span style="display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden"><span style="display:block;height:100%;background:#FFFFFF;transform-origin:left;transform:scaleX({{b.fill}});animation:{{b.anim}}"></span></span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="position:absolute;left:20px;right:20px;bottom:44px">
    <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{next}}" style="width:100%;height:56px;border:0;border-radius:999px;background:#22C9E0;color:#0E1826;font:600 17px Inter,sans-serif;cursor:pointer;box-shadow:0 10px 24px rgba(34,201,224,.3)">Далее</button>
    </sc-if>
    <sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}">
      <a href="iOS-SignIn.dc.html" style="height:56px;border-radius:999px;background:#22C9E0;color:#0E1826;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;text-decoration:none;box-shadow:0 10px 24px rgba(34,201,224,.3)">Начать</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { slide: 0 };
  }
  renderVals() {
    var self = this, i = this.state.slide;
    var copy = [
      { t: 'Все курьеры\nв одном окне', x: 'Сравним цены и сроки служб доставки и покажем лучший вариант.' },
      { t: 'Курьер заберёт\nсам', x: 'Выберите день и время — курьер приедет к двери. Компании платят по договору.' },
      { t: 'Каждая посылка\nна виду', x: 'Статусы всех отправлений и уведомления о каждом шаге — в одном месте.' }
    ];
    var bars = copy.map(function (c, k) {
      return {
        label: 'Слайд ' + (k + 1),
        fill: k < i ? 1 : (k === i ? 1 : 0),
        anim: k === i ? 'nxFill .6s cubic-bezier(.2,.8,.2,1) both' : 'none',
        go: function () { self.setState({ slide: k }); }
      };
    });
    return {
      slide: i, s0: i === 0, s1: i === 1, s2: i === 2,
      title: copy[i].t, text: copy[i].x, bars: bars,
      notLast: i < 2, isLast: i === 2,
      next: function () { self.setState({ slide: Math.min(2, i + 1) }); }
    };
  }
}
</script>
</body>
</html>
